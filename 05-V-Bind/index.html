<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VueJS Uygulama</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        .list{
            list-style-type: none;
            background: #131415;
            color: white;
            margin: 20px;
            padding: 10px 20px;
            border-radius: 15px;
            align-items: center;
            display: inline-block;
            cursor: pointer;
        }
        .list.selected{
            background-color: darkgray;
        }
        .button{
            border-radius: 15px;
            background-color: #0a6540;
            color:#a1b2b3;
            padding: 10px 20px;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script src="./app.js"></script>
</body>

</html>
